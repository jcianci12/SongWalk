kind: pipeline
type: docker
name: deploy

# Oracle Cloud ARM64 runner — matches ubuntuserver drone configuration.
platform:
  os: linux
  arch: arm64

concurrency:
  limit: 1

trigger:
  branch:
    - prod
  event:
    - push
    - manual

steps:
  - name: deploy
    image: docker:dind
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - echo "Deploying SongWalk..."
      - docker compose version
      - docker compose -p songwalk -f compose.yaml -f compose.prod.yaml down --timeout 30 --remove-orphans || true
      - docker compose -p songwalk -f compose.yaml -f compose.prod.yaml up -d --build --force-recreate
      - docker compose -p songwalk ps
      - echo "Connecting NPM to songwalk network..."
      - docker network connect songwalk_default nginx-app-1 2>/dev/null || echo "(already connected)"
    environment:
      SONGSHARE_PUBLISHED_PORT: "18080"
      SONGWALK_SMTP_USERNAME: "jon@tekonline.com.au"
      SONGWALK_SMTP_PASSWORD:
        from_secret: songwalk_smtp_password
      SONGWALK_SMTP_FROM: "jon@tekonline.com.au"

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock
