services:
  songwalk:
    build: .
    ports:
      - "${SONGWALK_PUBLISHED_PORT:-8080}:8080"
    environment:
      SONGWALK_DATA_DIR: /data
      SONGWALK_BASE_URL: ${SONGWALK_BASE_URL:-}
      SONGWALK_QUICK_TUNNEL_ENABLED: ${SONGWALK_QUICK_TUNNEL_ENABLED:-1}
      SONGWALK_PROXY_HOPS: ${SONGWALK_PROXY_HOPS:-1}
      SONGWALK_YOUTUBE_DL_BIN: ${SONGWALK_YOUTUBE_DL_BIN:-}
      SONGWALK_SPOTIFY_DL_BIN: ${SONGWALK_SPOTIFY_DL_BIN:-}
      SONGWALK_SPOTIFY_CLIENT_ID: ${SONGWALK_SPOTIFY_CLIENT_ID:-}
      SONGWALK_SPOTIFY_CLIENT_SECRET: ${SONGWALK_SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./songwalk-data:/data
