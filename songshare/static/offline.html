<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SongWalk — Offline</title>
  <link rel="stylesheet" href="/static/site.css">
  <style>
    .offline-shell {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(180deg, #2c82d3, #1a1a2e);
      color: #fff;
      text-align: center;
    }
    .offline-card {
      display: grid;
      gap: 16px;
      justify-items: center;
    }
    .offline-card h1 { margin: 0; font-size: 1.8rem; }
    .offline-card p { margin: 0; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="offline-shell">
    <div class="offline-card">
      <h1>SongWalk</h1>
      <p>You're offline. Pages you visited before will still work.</p>
      <p>Reconnect and refresh to get the latest content.</p>
    </div>
  </div>
</body>
</html>
